<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточки публичных выступлений — интерактивный тренажёр</title>
<style>
:root{
  --teal:#00504E; --teal-l:#0A6E6B; --red:#EE4923; --ink:#1d2b2a;
  --bg:#f4f6f6; --card:#ffffff; --muted:#6b7a79; --line:#e2e8e8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Geologica, Calibri, "Segoe UI", Tahoma, sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* Header */
header.top{
  background:var(--teal); color:#fff; position:sticky; top:0; z-index:40;
  box-shadow:0 2px 14px rgba(0,80,78,.18);
}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;white-space:nowrap}
.logo .dot{width:30px;height:30px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-size:16px}
.crumb{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;opacity:.95;flex-wrap:wrap}
.crumb span.link{cursor:pointer;opacity:.8;text-decoration:underline dotted}
.crumb span.link:hover{opacity:1}
.top .actions{display:flex;gap:8px;margin-left:14px}
.btn{
  border:none;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:14px;
  font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px
}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{filter:brightness(1.07)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.26)}
.btn-outline{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn-outline:hover{background:var(--teal);color:#fff}
.btn-sm{padding:7px 11px;font-size:13px}

main{padding:30px 0 80px}
h1{font-size:30px;margin:0 0 6px;color:var(--teal)}
h2{font-size:22px;margin:34px 0 14px;color:var(--teal)}
h3{font-size:17px;margin:0 0 6px}
.lead{font-size:16px;color:var(--muted);max-width:760px}
.hidden{display:none!important}

/* Section chips */
.grid{display:grid;gap:16px}
.grid.cats{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:22px}
.cat-card{
  background:var(--card);border-radius:16px;padding:20px;cursor:pointer;
  border:1px solid var(--line);border-top:5px solid var(--accent);
  transition:.18s;position:relative;overflow:hidden
}
.cat-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,80,78,.13)}
.cat-card .ic{font-size:30px;line-height:1}
.cat-card h3{margin:12px 0 6px;color:var(--accent)}
.cat-card p{margin:0;font-size:13.5px;color:var(--muted)}
.cat-card .meta{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:#eef2f2;color:#456;font-weight:600}
.pill.done{background:#e6f4ec;color:#1a7a4a}

/* Info blocks */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:18px}
.panel.accent{border-left:5px solid var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.two{grid-template-columns:1fr}}
ul.ticks{list-style:none;padding:0;margin:8px 0 0}
ul.ticks li{padding:7px 0 7px 28px;position:relative;border-bottom:1px dashed var(--line);font-size:14.5px}
ul.ticks li:last-child{border-bottom:none}
ul.ticks li:before{content:"▸";position:absolute;left:6px;top:7px;color:var(--red);font-weight:700}
ul.ticks li b{color:var(--teal)}

/* scenario table */
.scen{display:grid;gap:10px;margin-top:8px}
.scen .row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 16px;flex-wrap:wrap}
.scen .row .q{font-weight:600;flex:1;min-width:200px}
.scen .row .a{font-size:13px;color:var(--teal);background:#eef4f4;padding:5px 11px;border-radius:20px;font-weight:600}

/* Category header */
.cat-hero{border-radius:18px;padding:26px 28px;color:#fff;background:var(--accent);position:relative;overflow:hidden}
.cat-hero .ic{font-size:40px}
.cat-hero h1{color:#fff;margin:8px 0 4px}
.cat-hero p{margin:0;opacity:.95;max-width:720px}
.cat-hero .back{cursor:pointer;opacity:.9;font-size:14px;margin-bottom:14px;display:inline-block}
.cat-hero .back:hover{opacity:1;text-decoration:underline}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px;align-items:center}
.fbtn{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:13.5px;
  font-family:inherit;font-weight:600;cursor:pointer;color:#456;transition:.15s}
.fbtn:hover{border-color:var(--accent)}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.count{margin-left:auto;font-size:13px;color:var(--muted)}

/* card grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.flip{perspective:1200px;height:230px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:14px;padding:16px 17px;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card)}
.face.front{border-top:4px solid var(--accent)}
.face.front .lvl{font-size:12.5px;font-weight:700}
.face.front .n{margin-top:auto;font-size:12px;color:var(--muted)}
.face.front .goal{font-weight:700;color:var(--accent);font-size:15.5px;margin-top:10px;line-height:1.35}
.face.front .tap{margin-top:8px;font-size:12px;color:var(--muted)}
.face.back{transform:rotateY(180deg);background:var(--accent);color:#fff;border:none;overflow:auto}
.face.back .task{font-size:14px;line-height:1.5;flex:1}
.face.back .foot{margin-top:10px;font-size:12.5px;opacity:.92;display:flex;justify-content:space-between;align-items:center}
.done-badge{position:absolute;top:10px;right:10px;background:#1a7a4a;color:#fff;border-radius:50%;
  width:24px;height:24px;display:grid;place-items:center;font-size:13px;z-index:3}
.markbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;
  border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.markbtn:hover{background:rgba(255,255,255,.35)}

/* modal random */
.modal{position:fixed;inset:0;background:rgba(15,40,40,.55);display:grid;place-items:center;z-index:80;padding:18px}
.modal .box{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:26px;position:relative;
  border-top:6px solid var(--red)}
.modal .x{position:absolute;top:14px;right:16px;font-size:24px;cursor:pointer;color:var(--muted);background:none;border:none}
.modal .tag{font-size:12.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.4px}
.modal h3{color:var(--teal);font-size:20px;margin:6px 0 12px}
.modal .body{font-size:16px;line-height:1.6}
.modal .meta{margin:16px 0;font-size:13.5px;color:var(--muted)}
.modal .row{display:flex;gap:10px;margin-top:8px}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:22px 0;text-align:center}
.empty{text-align:center;color:var(--muted);padding:50px 0}


/* Mobile adaptation */
html {
  -webkit-text-size-adjust: 100%;
  scroll-padding-top: 76px;
}
body {
  min-width: 320px;
  overflow-x: hidden;
}
button, .cat-card, .flip, .logo, .back {
  touch-action: manipulation;
}
button {
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 3px solid #f4a261;
  outline-offset: 3px;
}
@media (hover: hover) and (pointer: fine) {
  .cat-card:hover { transform: translateY(-4px); }
}
@media (max-width: 720px) {
  .wrap { padding-left: 16px; padding-right: 16px; }
  main { padding: 22px 0 56px; }
  h1 { font-size: clamp(24px, 6vw, 30px); line-height: 1.2; }
  h2 { font-size: 20px; margin-top: 28px; }
  .lead { font-size: 15px; }
  .panel { padding: 18px; }
  .grid.cats { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
  .cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
  .cat-hero { padding: 22px; }
  .cat-hero h1 { font-size: clamp(24px, 6vw, 30px); }
  .filters { gap: 7px; }
  .fbtn { min-height: 40px; padding: 8px 12px; }
  .count { width: 100%; margin: 3px 0 0; }
  .scen .row { align-items: flex-start; }
  .scen .row .q { min-width: 0; flex-basis: 100%; }
  .scen .row .a { max-width: 100%; }
  footer { padding: 18px 0; }
}
@media (max-width: 600px) {
  header.top { position: sticky; }
  .top .wrap {
    height: auto;
    min-height: 60px;
    padding-top: 9px;
    padding-bottom: 9px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .logo {
    flex: 1 1 100%;
    min-width: 0;
    white-space: normal;
    font-size: 15px;
    line-height: 1.2;
    gap: 8px;
  }
  .logo .dot { flex: 0 0 30px; }
  .top .actions {
    width: 100%;
    margin: 0;
    gap: 8px;
  }
  .top .actions .btn:first-child { flex: 1; justify-content: center; }
  .top .actions .btn:last-child { min-width: 42px; justify-content: center; }
  .btn { min-height: 42px; }
  .btn-sm { min-height: 40px; padding: 8px 10px; }
  .panel.accent > div[style*="display:flex"] { align-items: flex-start !important; }
  .panel.accent > div[style*="display:flex"] .pill { align-self: center !important; }
  .flip { height: 260px; }
  .face { padding: 16px; }
  .face.front .goal { font-size: 16px; }
  .face.back .task { font-size: 14px; }
  .face.back .foot {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
  }
  .markbtn { min-height: 40px; width: 100%; font-size: 13px; }
  .modal { padding: 12px; align-items: end; }
  .modal .box {
    max-height: min(88dvh, 720px);
    overflow-y: auto;
    border-radius: 18px 18px 12px 12px;
    padding: 24px 18px 18px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
  }
  .modal .row { flex-direction: column; }
  .modal .row .btn { width: 100%; justify-content: center; min-height: 44px; }
  .modal .x { min-width: 40px; min-height: 40px; }
}
@media (max-width: 380px) {
  .wrap { padding-left: 12px; padding-right: 12px; }
  .grid.cats, .cards { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 15px; }
  .cat-hero { padding: 18px; }
  .scen .row { padding: 12px; }
  .fbtn { font-size: 12.5px; padding: 7px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}



/* Cross-device refinements */
html { min-height: 100%; }
body { min-height: 100vh; min-height: 100dvh; }
button, .fbtn { -webkit-appearance: none; appearance: none; }
.flip { -webkit-tap-highlight-color: transparent; }
.face.back { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal .box { -webkit-overflow-scrolling: touch; }
@media (max-width: 600px) {
  .flip { height: auto; min-height: 250px; aspect-ratio: 1 / 1.05; }
  .flip .inner { min-height: 250px; }
  .face { min-height: 250px; }
  .face.back .foot { flex-shrink: 0; }
  .modal { padding-top: max(12px, env(safe-area-inset-top)); }
}
@media (max-width: 360px) {
  .flip { aspect-ratio: auto; min-height: 270px; }
  .flip .inner, .face { min-height: 270px; }
}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo" onclick="go('')"><span class="dot">🎤</span><span>Карточки публичных выступлений</span></div>
    <div class="actions">
      <button class="btn btn-ghost btn-sm" onclick="showRandom()">🎲 Случайная карточка</button>
      <button class="btn btn-red btn-sm" id="resetBtn" onclick="resetProgress()" title="Сбросить отметки о выполнении">↺</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="view">
    <div class="panel" role="status">
      <h1>Тренажёр публичных выступлений</h1>
      <p>Загружаются разделы и карточки упражнений…</p>
      <p style="color:var(--muted);font-size:14px">Если этот экран не меняется, откройте страницу в Safari, Chrome или другом полноценном браузере.</p>
    </div>
  </div>
  <noscript><div class="wrap"><div class="panel">Для работы интерактивного тренажёра необходимо включить JavaScript в браузере.</div></div></noscript>
</main>

<div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="box">
    <button class="x" onclick="closeModal()">×</button>
    <div class="tag" id="m-tag"></div>
    <h3 id="m-goal"></h3>
    <div class="body" id="m-task"></div>
    <div class="meta" id="m-meta"></div>
    <div class="row">
      <button class="btn btn-outline btn-sm" onclick="showRandom()">🎲 Другая карточка</button>
      <button class="btn btn-red btn-sm" id="m-open" onclick="">Открыть раздел</button>
    </div>
  </div>
</div>

<footer><div class="wrap">Интерактивный тренажёр · 6 категорий · 60 карточек-микро-тренировок</div></footer>

<script>
const DATA = {"cats":[{"slug":"voice","title":"Голос и речь","icon":"🎙","color":"#00504E","develops":"дыхание, дикцию, темп, интонацию, устойчивость голоса","why":"Даже самая сильная идея теряется в невыразительной речи. Голос — ваш инструмент влияния. Эта категория учит управлять голосом как инструментом: говорить так, чтобы вас хотели слушать — даже в шумной комнате или при усталости аудитории.","inside":"упражнения на дыхание, работа с паузами, борьба со словами-паразитами, модуляция под эмоции и аудиторию","method":{"trains":"Дыхание, громкость, чёткость артикуляции, темп, интонация, устойчивость голоса под нагрузкой.","why":["Физиологически: дышите грудью → мало воздуха → голос садится; напряжены челюсть и горло → речь «зажата».","Психологически: тревога ускоряет речь; паузы кажутся «неловкими» → заполняете их словами-паразитами.","Из-за нехватки опыта: нет привычки слушать себя со стороны; не знаете, как должен звучать «рабочий» голос."],"idea":"Голос — результат трёх систем: дыхание (диафрагма = двигатель), вибрация (голосовые связки = источник звука), артикуляция (рот, язык, губы = «формирователь» звука).","measure":"До/После: запишите одно и то же выступление до и после 2 недель тренировок. Самооценка: «Насколько мой голос звучит уверенно?» по шкале 1–10.","ex":[{"t":"Диафрагмальное дыхание «живот-лёд\"","s":"Лягте на спину, книга на живот. Вдох через нос — книга поднимается. Выдох через рот — опускается. 10 раз.","c":"Грудь почти не двигается? Живот поднимается?"},{"t":"«Счёт на выдохе\"","s":"Глубокий вдох диафрагмой, на выдохе медленно считайте вслух. Запишите, до какого числа дошли. 3 попытки, счёт увеличивайте.","c":"Дошли до 15+? Голос дрожит на 5? — вернитесь к упражнению 1."},{"t":"Артикуляционная разминка «5 звуков\"","s":"Перед зеркалом по 10 секунд: «Ба-ба-ба», «Да-да-да», «Га-га-га», «Ла-ла-ла», «Ры-ры-ры».","c":"Звуки чёткие, без «смыканий»? Лицо не напряжено?"},{"t":"Скороговорки с контролем","s":"Проговорите 3 раза медленно и чётко, затем 3 раза быстро без потери чёткости. Запишите на диктофон.","c":"На записи слышно каждое слово? Нет «проглатывания» согласных?"},{"t":"Пауза вместо паразита","s":"Говорите 1 минуту на любую тему. Хочется сказать «ну/типа/вот» — остановитесь на 2 секунды. 3 попытки.","c":"Стало меньше паразитов? Паузы не вызывают паники?"},{"t":"Громкость «3 уровня\"","s":"Фраза «Сегодня я хочу поделиться…» трижды: для себя, для друга рядом, для человека у двери.","c":"На 3-м уровне голос не напрягается? Звучит уверенно, а не агрессивно?"},{"t":"Интонационные акценты","s":"Фраза «Я не сказал, что ты неправ» — 6 раз, каждый раз с акцентом на новом слове.","c":"Смысл меняется? Акцент чёткий, а не «замыленный»?"},{"t":"Темп под эмоцию","s":"Короткая история (30 сек) дважды: срочная новость (быстро, тон выше) и утешение друга (медленно, мягко, тон ниже).","c":"Эмоция слышна без слов? Темп не «скачет» хаотично?"},{"t":"Голос под стрессом","s":"10 приседаний, сразу после них — «Сегодня я хочу поделиться…». Запишите ощущения.","c":"Голос не дрожит? Речь чёткая?"},{"t":"3-минутное выступление с фокусом на голосе","s":"Подготовьте выступление и следите только за дыханием, паузами (минимум 3) и громкостью уровня 3.","c":"Голос уверенный от начала до конца? Нет «провалов» на 2-й минуте?"}]},"cards":[{"id":0,"lvl":"easy","goal":"Осознать свою естественную громкость.","task":"Прочитайте вслух одно предложение три раза: шёпотом, «обычно» и «как будто вы говорите с другого конца комнаты». Запишите все три версии и сравните — где вы звучите увереннее?","time":"5 мин"},{"id":1,"lvl":"easy","goal":"Улучшить чёткость артикуляции.","task":"Проговорите скороговорку «Карл у Клары украл кораллы» пять раз подряд, не сбиваясь. Выполняйте упражнение стоя, с открытым ртом и чёткими движениями губ.","time":"4 мин"},{"id":2,"lvl":"easy","goal":"Научиться дышать диафрагмой.","task":"Положите руку на живот. Сделайте вдох через нос (живот надувается), выдох через рот (живот сдувается). Повторите 10 раз, затем произнесите фразу на одном выдохе.","time":"6 мин"},{"id":3,"lvl":"easy","goal":"Избавиться от слов-паразитов.","task":"Запишите одну минуту спонтанной речи на любую тему. Посчитайте, сколько раз вы использовали слова-паразиты («ну», «вот», «типа» и т.п.). Повторите то же самое, заменяя паразиты паузами.","time":"8 мин"},{"id":4,"lvl":"mid","goal":"Освоить интонационные акценты.","task":"Возьмите предложение: «Это не просто идея — это решение». Произнесите его, делая акцент на каждом слове по очереди. Обратите внимание, как меняется смысл высказывания.","time":"7 мин"},{"id":5,"lvl":"mid","goal":"Работать с темпом речи под эмоцию.","task":"Расскажите короткую историю (30 секунд) дважды: как будто делитесь срочной новостью (быстро) и как будто утешаете друга (медленно и мягко).","time":"9 мин"},{"id":6,"lvl":"mid","goal":"Использовать паузы для драматического эффекта.","task":"Подготовьте три предложения с неожиданным поворотом (например: «Я думал, что знаю всё… [пауза 2–3 секунды]… пока не услышал её вопрос»). Отработайте паузу.","time":"8 мин"},{"id":7,"lvl":"mid","goal":"Тренировать устойчивость голоса при стрессе.","task":"Сделайте 10 приседаний, затем сразу начните говорить спокойно и чётко: «Сегодня я хочу поделиться…». Запишите результат — дрожит ли голос?","time":"6 мин"},{"id":8,"lvl":"hard","goal":"Модулировать голос под разные типы аудитории.","task":"Возьмите один и тот же тезис. Произнесите его так, как будто обращаетесь к подросткам, генеральному директору и пожилым людям. Обратите внимание на высоту тона, темп и лексику.","time":"12 мин"},{"id":9,"lvl":"hard","goal":"Удерживать голосовую энергию в течение 5+ минут.","task":"Запишите пятиминутное выступление. Прослушайте его и отметьте участки, где голос «проваливается» или теряет выразительность. Переподготовьте эти фрагменты с акцентом на дыхании и намерении.","time":"20 мин"}]},{"slug":"body","title":"Тело и присутствие","icon":"🙌","color":"#0A6E6B","develops":"осанку, жесты, контакт глаз, движение по сцене, харизму","why":"Люди реагируют не только на слова, но и на то, как вы их подаёте. До 55% восприятия идёт через тело (по модели Альберта Мехрабиана). Эта категория учит занимать пространство, излучать спокойную уверенность и использовать тело как союзника, а не как помеху.","inside":"нейтральная стойка, открытые жесты, движение с намерением, работа с мимикой и адаптация под онлайн/офлайн","method":{"trains":"Осанка, жесты, контакт глаз, движение по сцене, харизма, адаптация под онлайн/офлайн.","why":["Физически: хроническое напряжение в плечах и шее → закрытая поза.","Эмоционально: стыд, тревога → избегание контакта глазами.","Когнитивно: «надо стоять как статуя» → замирание вместо присутствия."],"idea":"Правило «7/38/55»: 7% информации передаётся словами, 38% — тоном и интонацией, 55% — невербально (мимика и жесты).","measure":"Запишите выступление «до» и «после» — сравните открытость, энергию, контакт. Спросите окружающих: «Какое впечатление я произвёл?» — ответы станут конкретнее.","ex":[{"t":"Нейтральная стойка у стены","s":"Встаньте у стены: пятки, ягодицы, лопатки, затылок её касаются. Запомните ощущение, отойдите, сохраните позу и произнесите: «Я здесь».","c":"Дышится легко? Плечи опущены, грудная клетка раскрыта?"},{"t":"«Открытые руки» перед зеркалом","s":"Скажите «Я рад(а) вас видеть», руки в зоне от пояса до плеч, ладони слегка развёрнуты вперёд. 3 раза, не скрещивая руки.","c":"Ладони видны? Жесты естественны, а не «на показ»?"},{"t":"Контакт глаз «точка → точка\"","s":"Выберите 3 объекта в комнате и смотрите на каждый по 2–3 секунды во время фразы. Затем повторите, смотря в камеру.","c":"Взгляд не «убегает»? Сохраняется связь с собеседником?"},{"t":"Шаг с намерением","s":"Уверенный шаг вперёд со словами «Это важно». Вернитесь, повторите с разной скоростью.","c":"Шаг не «волочится»? Слова и движение синхронны?"},{"t":"Жесты под слова","s":"Фраза с числом («Три шага к уверенности») — показывайте число ровно в тот момент, когда произносите его.","c":"Жест не опережает и не отстаёт от слова? Движение чёткое?"},{"t":"Движение по зонам","s":"Три зоны: слева — проблема, центр — решение, справа — будущее. Проговорите мини-выступление, переходя между ними.","c":"Переходы осознанны? Аудитория «чувствует» смену темы?"},{"t":"Мимика под эмоцию","s":"Одна и та же фраза с разным лицом: удивление, уверенность, сочувствие. Запишите на камеру.","c":"Эмоция читается без слов? Лицо не «каменное» и не «театральное»?"},{"t":"Технический сбой","s":"Сымитируйте «микрофон отключился» и продолжайте говорить, не теряя позы и контакта.","c":"Паника не берёт верх? Вы остаётесь «на сцене»?"},{"t":"Харизма через открытость","s":"Запишите 2-минутное выступление дважды: с нейтральной позой и с открытой (руки видны, лёгкая улыбка, энергия).","c":"Во втором варианте хочется слушать дольше? Энергия передаётся?"},{"t":"Адаптация под формат","s":"Одно и то же сообщение — перед камерой и перед «аудиторией» из стульев. Отметьте различия в жестах, громкости, взгляде.","c":"Онлайн: жесты ближе к телу? Офлайн: голос громче, движения шире?"}]},"cards":[{"id":10,"lvl":"easy","goal":"Найти «нейтральную стойку».","task":"Встаньте перед зеркалом: ноги на ширине плеч, руки по швам, плечи расслаблены. Произнесите фразу: «Я здесь». Почувствуйте устойчивость и опору.","time":"3 мин"},{"id":11,"lvl":"easy","goal":"Осознать контакт глаз.","task":"Включите камеру. Говорите 30 секунд, глядя строго в объектив. Представьте, что вы смотрите в глаза одному человеку.","time":"5 мин"},{"id":12,"lvl":"easy","goal":"Избавиться от «мёртвых зон».","task":"Проговорите одну минуту, держа руки в зоне от пояса до плеч. Используйте как минимум три осознанных жеста.","time":"6 мин"},{"id":13,"lvl":"easy","goal":"Научиться «занимать пространство».","task":"Встаньте в углу комнаты. Сделайте уверенный шаг вперёд и скажите: «Это важно». Обратите внимание, как меняется ваше присутствие.","time":"4 мин"},{"id":14,"lvl":"mid","goal":"Синхронизировать жесты со словами.","task":"Подготовьте фразу с числом (например: «три шага»). Произнесите её, показывая число жестом **в тот же момент**, когда произносите слово.","time":"7 мин"},{"id":15,"lvl":"mid","goal":"Использовать движение по сцене с намерением.","task":"Разделите воображаемую сцену на три зоны: проблема (слева), решение (в центре), будущее (справа). Проговорите мини-выступление, переходя между зонами.","time":"10 мин"},{"id":16,"lvl":"mid","goal":"Работать с мимикой под эмоцию.","task":"Выберите эмоцию (удивление, уверенность, сочувствие). Произнесите одну и ту же фразу с разной мимикой. Запишите и сравните — что доносится сильнее?","time":"8 мин"},{"id":17,"lvl":"mid","goal":"Сохранять присутствие при технических сбоях.","task":"Сымитируйте ситуацию: «Микрофон отключился». Продолжайте говорить уверенно, не теряя зрительного контакта и открытой позы.","time":"5 мин"},{"id":18,"lvl":"hard","goal":"Управлять харизмой через невербалику.","task":"Запишите двухминутное выступление дважды: с нейтральной позой и с харизматичной подачей (открытость, лёгкая улыбка, энергия). Сравните восприятие.","time":"15 мин"},{"id":19,"lvl":"hard","goal":"Адаптировать телесность под формат выступления.","task":"Подготовьте одно и то же сообщение. Выполните его: стоя перед камерой (онлайн) и перед «аудиторией» из стульев (офлайн). Отметьте различия в жестах, громкости и зрительном контакте.","time":"12 мин"}]},{"slug":"structure","title":"Структура и содержание","icon":"🧩","color":"#1F7A77","develops":"логику, ясность, композицию, умение доносить суть без «воды»","why":"Хорошая структура — основа понимания и запоминания. Без неё даже блестящая подача остаётся «пустышкой». Эта категория учит выстраивать чёткую дугу выступления, где каждая часть работает на результат.","inside":"хуки, якорные фразы, правило «одна идея — один слайд», нарративная дуга, адаптация структуры под разные типы аудитории","method":{"trains":"Логика, ясность, композиция, хуки, финалы, адаптация под аудиторию.","why":["«Всё важно» → нет фокуса.","Нет шаблона → хаос в голове.","Боитесь упрощать → перегружаете деталями."],"idea":"Мозг запоминает структуру, а не информацию. Лучшие схемы: Проблема → Решение → Выгода; Путь героя; Антитеза («Было / Стало»).","measure":"Проверка: после выступления аудитория может повторить суть в 10 словах?","ex":[{"t":"Формула П-Р-В","s":"Проблема → Решение → Выгода на 30 секунд. Уложитесь в это время без заготовленного текста."},{"t":"Один слайд — одна мысль","s":"Возьмите свою презентацию и уберите из неё 30% слов. Оставьте только то, что держит мысль."},{"t":"Якорная фраза","s":"Сформулируйте главную мысль одной фразой и повторите её в выступлении 3 раза."},{"t":"Хук-вопрос","s":"Начните выступление с вопроса к залу: «Кто из вас…?»"},{"t":"Антитеза","s":"Постройте фрагмент по схеме «Раньше… / Теперь…»."},{"t":"Финал с призывом","s":"Закончите конкретным действием: «Сделайте вот это…»."},{"t":"История «от А до Я»","s":"Возьмите рабочий процесс и разбейте его на последовательные шаги-этапы."},{"t":"Адаптация под аудиторию","s":"Одно сообщение — в версии для аналитиков (данные) и для руководителя (выгода)."},{"t":"Проверка на воду","s":"Пройдите по тексту и вычеркните всё, что не влияет на смысл."},{"t":"Структура «Путь героя»","s":"Обычный мир → вызов → прозрение → новый мир. Соберите так короткое выступление."}]},"cards":[{"id":20,"lvl":"easy","goal":"Сформулировать ясный хук.","task":"Напишите три варианта начала выступления: вопрос, шокирующий факт, личная история. Выберите самый цепляющий.","time":"8 мин"},{"id":21,"lvl":"easy","goal":"Чётко обозначить цель выступления.","task":"Закончите фразу: «После моего выступления аудитория…» (что поймёт, почувствует или сделает?).","time":"5 мин"},{"id":22,"lvl":"easy","goal":"Разделить речь на три части.","task":"Напишите план: введение (одна ключевая мысль), основная часть (2–3 пункта), заключение (чёткий призыв к действию).","time":"10 мин"},{"id":23,"lvl":"easy","goal":"Избегать «воды» в речи.","task":"Возьмите абзац текста. Вычеркните 30 % слов, не теряя смысла. Проговорите сокращённую версию вслух.","time":"7 мин"},{"id":24,"lvl":"mid","goal":"Соблюдать правило «одна идея — один слайд».","task":"Возьмите сложную мысль. Разбейте её на 2–3 последовательных шага. Подайте как логичную историю «от А до Я».","time":"10 мин"},{"id":25,"lvl":"mid","goal":"Встроить «якорные фразы».","task":"Придумайте короткую фразу-слоган (например: «Меняй систему — не себя»). Используйте её в начале, середине и конце выступления.","time":"8 мин"},{"id":26,"lvl":"mid","goal":"Работать с антитезой.","task":"Сформулируйте контраст: «Раньше я… / Теперь я…» или «Без этого — хаос / С этим — ясность».","time":"6 мин"},{"id":27,"lvl":"mid","goal":"Завершать выступление с силой.","task":"Напишите три варианта финала: призыв к действию, возвращение к началу, провокационный вопрос.","time":"9 мин"},{"id":28,"lvl":"hard","goal":"Строить нарративную дугу по модели «Путь героя».","task":"Опишите свой опыт по схеме: обычный мир → вызов → борьба → прозрение → новый мир. Превратите это в трёхминутное выступление.","time":"20 мин"},{"id":29,"lvl":"hard","goal":"Адаптировать структуру под тип аудитории.","task":"Возьмите одну идею. Подготовьте три версии структуры: для аналитиков (факты и данные), для руководителей (выгода и ROI), для новичков (история и метафора).","time":"25 мин"}]},{"slug":"emotion","title":"Эмоции и вовлечение","icon":"💬","color":"#C2410C","develops":"эмпатию, сторителлинг, интерактив, личную подачу","why":"Люди запоминают не факты, а эмоции и истории. Эта категория учит создавать эмоциональную связь, вовлекать аудиторию и делать выступление живым, а не лекцией.","inside":"личные истории, вопросы к аудитории, работа с «мы» вместо «я», управление групповой эмоцией, уязвимость как сила","method":{"trains":"Сторителлинг, эмпатия, интерактив, личная подача, управление вниманием.","why":["Боитесь показать уязвимость.","Думаете: «эмоции = непрофессионально».","Не знаете, как «включить» аудиторию."],"idea":"Люди не запоминают факты — они запоминают чувства. Эмоции = личный опыт + метафора + вопросы. Вовлечение = диалог, а не монолог.","measure":"Проверка: после выступления кто-то подходит и говорит: «Это про меня»?","ex":[{"t":"Мини-история «До/После»","s":"Расскажите за 30 секунд, как было до изменения и что стало после."},{"t":"Вопросы к «невидимой» аудитории","s":"Задавайте вопросы залу: «Кто сталкивался?» — и выдерживайте паузу."},{"t":"«Мы» вместо «я»","s":"Перепишите фрагмент выступления так, чтобы создать общность с аудиторией."},{"t":"Метафора","s":"Объясните сложную мысль через образ: «Это как GPS для карьеры»."},{"t":"Самоирония","s":"Вставьте лёгкий юмор про себя в напряжённый момент выступления."},{"t":"«Момент узнавания»","s":"Опишите знакомую ситуации: «Вы открываете ноутбук в 23:00…»"},{"t":"Эмоциональная волна","s":"Постройте выступление: напряжение → разрядка → вдохновение."},{"t":"Немой интерактив","s":"Попросите зал показать пальцем оценку от 1 до 5."},{"t":"Переключатель эмоций","s":"Подготовите короткую фразу для снятия напряжения в зале."},{"t":"Уязвимость как сила","s":"Расскажите о собственном провале и сформулируйте урок из него."}]},"cards":[{"id":30,"lvl":"easy","goal":"Включить вопрос к аудитории.","task":"Добавьте в выступление открытый вопрос: «Кто из вас сталкивался с этим?» или «Что бы вы сделали на моём месте?»","time":"5 мин"},{"id":31,"lvl":"easy","goal":"Использовать метафору.","task":"Опишите свою идею через сравнение: «Это как…» (например: «как GPS для вашей карьеры»).","time":"6 мин"},{"id":32,"lvl":"easy","goal":"Поделиться мини-историей.","task":"Расскажите за 30 секунд короткую историю из жизни, связанную с темой выступления.","time":"7 мин"},{"id":33,"lvl":"easy","goal":"Вызвать улыбку.","task":"Вставьте в начало выступления лёгкую иронию или самоиронию.","time":"5 мин"},{"id":34,"lvl":"mid","goal":"Работать с «эмоциональной волной».","task":"Постройте мини-выступление по схеме: напряжение → разрядка → вдохновение.","time":"12 мин"},{"id":35,"lvl":"mid","goal":"Использовать «мы» вместо «я».","task":"Перепишите одну минуту своего выступления, заменяя «я» на «мы» или «вместе мы». Почувствуйте разницу во вовлечённости.","time":"8 мин"},{"id":36,"lvl":"mid","goal":"Включить немой интерактив.","task":"Предложите аудитории поднять руку, кивнуть или показать пальцем оценку от 1 до 5 в ответ на ваш вопрос.","time":"4 мин"},{"id":37,"lvl":"mid","goal":"Создать «момент узнавания».","task":"Опишите типичную ситуацию, которую узнает каждый: «Вы открываете ноутбук в 23:00 и думаете…».","time":"7 мин"},{"id":38,"lvl":"hard","goal":"Управлять групповой эмоцией в реальном времени.","task":"Подготовьте «эмоциональный переключатель» — фразу или короткую историю, которая снимает напряжение или возвращает внимание, если аудитория устала.","time":"15 мин"},{"id":39,"lvl":"hard","goal":"Вплести личную уязвимость как силу.","task":"Расскажите о провале, который стал поворотным моментом. Сфокусируйтесь не на стыде, а на уроке и трансформации.","time":"18 мин"}]},{"slug":"fear","title":"Страх и внутренний критик","icon":"🌊","color":"#7C2D12","develops":"психологическую устойчивость, работу с тревогой, самооценку","why":"Страх сцены — главный барьер даже для опытных спикеров. Эта категория учит не бороться со страхом, а превращать его в энергию, а внутреннего критика — в союзника.","inside":"техники переосмысления, визуализация успеха, ритуалы перед выступлением, работа с перфекционизмом и «анти-страх» списки","method":{"trains":"Психологическая устойчивость, работа с тревогой, самооценка, фокус на пользе.","why":["Катастрофизация: «меня осудят».","Перфекционизм: «должно быть идеально».","Отождествление: «если провалюсь — я неудачник»."],"idea":"Страх — это нереализованная энергия. Внутренний критик — защитник, а не враг. Задача — не убрать страх, а дать ему место и перенаправить.","measure":"Проверка: тревога есть, но вы всё равно начинаете говорить?","ex":[{"t":"Назови страх","s":"Запишите конкретно: «Я боюсь, что…» — и посмотрите на формулировку трезво."},{"t":"Отделите «я» от «выступления»","s":"Повторите установку: «Я достоин быть услышанным»."},{"t":"Переосмысление","s":"Замените «я взволнован» на «я готов»."},{"t":"Визуализация успеха","s":"Представьте, как выступление проходит успешно и зал вам аплодирует."},{"t":"«Анти-страх» список","s":"Напишите 3 доказательства: «Я справлюсь, потому что…»"},{"t":"Ритуал перед выступлением","s":"Соберите связку: дыхание + фраза-настройка + движение. Используйте её всегда."},{"t":"Письмо перфекционизму","s":"Ответьте ему: «Ты хочешь идеала. Я — пользы»."},{"t":"Снижение значимости","s":"Спросите себя: «Будет ли это важно через год?»"},{"t":"Превращение тревоги в энергию","s":"20 прыжков или активное движение — и сразу в речь."},{"t":"«Провал → Опыт»","s":"Разберите недавний провал: «Что я получил благодаря этому?»"}]},"cards":[{"id":40,"lvl":"easy","goal":"Назвать страх.","task":"Запишите: «Больше всего я боюсь…». Прочитайте вслух.","time":"3 мин"},{"id":41,"lvl":"easy","goal":"Создать ритуал перед выступлением.","task":"Придумайте три простых действия (например: глубокий вдох, потянуться, сказать поддерживающую фразу). Выполните их перед зеркалом.","time":"5 мин"},{"id":42,"lvl":"easy","goal":"Перевести «провал» в «опыт».","task":"Вспомните неудачное выступление. Напишите: «Что я получил(а) благодаря этому?»","time":"7 мин"},{"id":43,"lvl":"easy","goal":"Снизить значимость ошибки.","task":"Представьте, что вы ошиблись на сцене. Спросите себя: «Будет ли это важно через год?»","time":"4 мин"},{"id":44,"lvl":"mid","goal":"Разделить «я» и «выступление».","task":"Напишите: «Моё выступление может быть неидеальным. Но я достоин(а) быть услышанным(ой)».","time":"6 мин"},{"id":45,"lvl":"mid","goal":"Использовать технику переосмысления.","task":"Замените фразу «Я нервничаю» на «Я взволнован(а) и готов(а)». Почувствуйте разницу в восприятии.","time":"5 мин"},{"id":46,"lvl":"mid","goal":"Визуализировать успех.","task":"Закройте глаза. Представьте, как вы уверенно говорите, аудитория кивает и аплодирует. Добавьте звуки, свет, тактильные ощущения.","time":"8 мин"},{"id":47,"lvl":"mid","goal":"Составить «анти-страх»-список.","task":"Напишите три доказательства того, что вы справитесь: прошлые успехи, уровень подготовки, поддержка окружающих.","time":"7 мин"},{"id":48,"lvl":"hard","goal":"Работать с перфекционизмом как с препятствием для влияния.","task":"Напишите письмо своему перфекционизму: «Ты хочешь, чтобы я был(а) идеальным(ой). Но моя цель — быть полезным(ой)».","time":"12 мин"},{"id":49,"lvl":"hard","goal":"Превратить тревогу в энергию.","task":"Сделайте 20 прыжков на месте, затем сразу начните говорить. Почувствуйте, как адреналин работает на вас, а не против вас.","time":"6 мин"}]},{"slug":"feedback","title":"Обратная связь и рефлексия","icon":"🪞","color":"#3F3D56","develops":"навык анализа, рост через осознанность, цикл постоянного улучшения","why":"Рост происходит не в момент выступления, а после него — через осмысление. Эта категория учит работать с обратной связью и собственным опытом системно, а не разово.","inside":"дневник спикера, «аудиторский портрет», анализ по трём осям, рефлексия через тело, создание дорожной карты развития","method":{"trains":"Анализ, осознанность, цикл роста, работа с обратной связью.","why":["Болезненно смотреть запись себя.","Нет системы — только эмоции.","Не знаете, что именно улучшать."],"idea":"Рост = Действие → Анализ → Коррекция. Без рефлексии — только повторение. Обратная связь должна быть конкретной, структурированной и ориентированной на будущее.","measure":"Проверка: есть ли запись последних 3 выступлений и план на следующее?","ex":[{"t":"Минимум один успех","s":"После любого выступления отметьте: «Я горжусь собой за…»"},{"t":"3 первых слова","s":"Сразу после выступления запишите 3 первых слова, которые приходят в голову."},{"t":"Ожидание / реальность","s":"Сравните: «Я боялся… / На самом деле…»"},{"t":"Мини-обратная связь себе","s":"Задайте себе вопрос: «Что запомнилось из моего выступления?»"},{"t":"Самоанализ по 3 составляющим","s":"Оцените по шкале 1–5: содержание, подача, связь с залом."},{"t":"Структурированная обратная связь","s":"Ответьте: что усилить, что убрать, что добавить."},{"t":"Дневник спикера","s":"Фиксируйте: дата, формат, эмоция, урок."},{"t":"Рефлексия через тело","s":"Где напряжение? Что его вызывает? Что я могу сделать?"},{"t":"Аудиторский портрет","s":"Опишите: кто был вовлечён, кто отключился и когда, почему это могло произойти."},{"t":"Дорожная карта развития","s":"Соберите план: над чем работаете в следующие 2 недели."}]},"cards":[{"id":50,"lvl":"easy","goal":"Зафиксировать первое впечатление.","task":"После выступления запишите первые три слова, которые приходят в голову.","time":"2 мин"},{"id":51,"lvl":"easy","goal":"Отметить один успех.","task":"Напишите: «Сегодня я горжусь собой за то, что…».","time":"3 мин"},{"id":52,"lvl":"easy","goal":"Получить микро-обратную связь.","task":"Спросите у одного человека: «Что тебе запомнилось больше всего?»","time":"5 мин"},{"id":53,"lvl":"easy","goal":"Сравнить ожидания и реальность.","task":"До выступления напишите: «Я боюсь, что…». После — «На самом деле…».","time":"6 мин"},{"id":54,"lvl":"mid","goal":"Анализ по трём осям.","task":"Оцените себя по шкале от 1 до 5 по трём параметрам: содержание, подача, связь с аудиторией. Что улучшить в первую очередь?","time":"8 мин"},{"id":55,"lvl":"mid","goal":"Собрать структурированную обратную связь.","task":"Попросите коллегу ответить на три вопроса: Что усилить? Что убрать? Что добавить?","time":"10 мин"},{"id":56,"lvl":"mid","goal":"Вести «дневник спикера».","task":"После каждого выступления фиксируйте: дата, формат, эмоция, один главный урок.","time":"5 мин"},{"id":57,"lvl":"mid","goal":"Провести рефлексию через телесные ощущения.","task":"Закройте глаза. Спросите себя: «Где в теле осталось напряжение? Что это говорит о моём выступлении?»","time":"7 мин"},{"id":58,"lvl":"hard","goal":"Провести «аудиторский портрет».","task":"После выступления опишите: кто был вовлечён, кто отключился и когда, почему это могло произойти.","time":"15 мин"},{"id":59,"lvl":"hard","goal":"Создать цикл постоянного улучшения.","task":"На основе трёх последних выступлений составьте «дорожную карту развития»: навык №1 для прокачки, метод его развития, срок реализации.","time":"20 мин"}]}],"home":{"about":"Этот набор из 60 карточек — практический инструмент для системного развития навыков публичных выступлений. Он создан для тех, кто хочет говорить уверенно, ясно и вдохновляюще — будь то презентация, питч, выступление на конференции или просто ответ на собрании.","about2":"Каждая карточка — микро-тренировка (от 2 до 25 минут), сфокусированная на одном конкретном аспекте выступления. Вместо абстрактных советов — чёткое задание, которое можно выполнить сразу. Карточки разделены на 6 категорий, охватывающих все ключевые компоненты эффективного выступления — от дыхания и позы до структуры, эмоций и работы со страхом.","solo":[{"t":"Ежедневная тренировка","d":"Открывайте 1 карточку в день — это ваша «мини-тренировка». Нажмите «Случайная карточка» на главной."},{"t":"Подготовка к выступлению","d":"Соберите «колоду» из 5–10 карточек, релевантных вашему формату: питч, доклад, онлайн-вебинар."},{"t":"Фокус на слабом месте","d":"Если «говорите монотонно» — работайте с категорией «Голос и речь»; если «боитесь» — берите «Страх и внутренний критик»."}],"coach":[{"t":"Диагностика","d":"Попросите участника выбрать 3 карточки, которые вызывают сопротивление — это зоны роста."},{"t":"Домашнее задание","d":"Давайте 1–2 карточки между сессиями."},{"t":"Групповая работа","d":"Участники выполняют задание и дают друг другу обратную связь по карточке из категории «Обратная связь и рефлексия»."},{"t":"Разминка","d":"Начинайте тренинг с карточки «Тело и присутствие» — это включает группу."}],"levels":[{"l":"easy","icon":"🟢","t":"Лёгкий","d":"Идеален для старта, разминки, работы со страхом."},{"l":"mid","icon":"🟡","t":"Средний","d":"Для тех, кто уже выступает, но хочет улучшить подачу."},{"l":"hard","icon":"🔴","t":"Сложный","d":"Для продвинутых спикеров — нюансы влияния, харизма, адаптация под контекст."}],"principles":["Регулярность важнее длительности: 5–10 минут каждый день лучше, чем 1 час раз в неделю.","Видеозапись — ваш друг: записывайте себя. Это ускоряет прогресс в 3 раза.","Не стремитесь к идеалу: цель — быть полезным, а не безупречным.","Комбинируйте категории: «Структура» + «Эмоции» = выступление, которое и логично, и трогает.","Используйте карточки как «напоминалки»: даже опытные спикеры перед важным выступлением делают 2–3 упражнения из «Страха» и «Голоса»."],"scenarios":[{"s":"Первый раз выступаю","c":["Страх","Голос","Структура"],"lvl":"🟢"},{"s":"Готовлюсь к выступлению","c":["Структура","Эмоции","Тело"],"lvl":"🔴 / 🟡"},{"s":"Выступаю и теряю внимание","c":["Эмоции","Тело","Обратная связь"],"lvl":"🟡 / 🔴"},{"s":"Хочу говорить харизматичнее","c":["Тело","Эмоции","Голос"],"lvl":"🔴"},{"s":"После выступления чувствую опустошение","c":["Страх","Обратная связь"],"lvl":"🟡 / 🟢"}]}};
const LVL = {easy:"🟢 Лёгкий", mid:"🟡 Средний", hard:"🔴 Сложный"};
const bySlug = {}; DATA.cats.forEach(c=>bySlug[c.slug]=c);
const ALL = []; DATA.cats.forEach(c=>c.cards.forEach(x=>ALL.push({...x, slug:c.slug, cat:c.title, accent:c.color})));

/* progress */
let DONE = {};
try{ DONE = JSON.parse(localStorage.getItem("cards_done")||"{}"); }catch(e){ DONE={}; }
function saveDone(){
  try { localStorage.setItem("cards_done", JSON.stringify(DONE)); }
  catch(e) { /* Тренажёр продолжает работать в текущей сессии, даже если хранилище запрещено. */ }
}
function toggleDone(id){ if(DONE[id])delete DONE[id]; else DONE[id]=1; saveDone(); render(); }
function resetProgress(){ if(confirm("Сбросить все отметки о выполнении?")){DONE={};saveDone();render();} }
function doneCount(arr){ return arr.filter(c=>DONE[c.id]).length; }

/* router */
function go(hash){ location.hash = "#/"+(hash||""); }
function parseHash(){
  const h = (location.hash||"").replace(/^#\/?/,"");
  return h.split("/").filter(Boolean); // [] | [slug]
}
window.addEventListener("hashchange", render);
window.addEventListener("error", function(e){
  const view = document.getElementById("view");
  if (view && !view.innerHTML.trim()) {
    view.innerHTML = '<div class="panel"><h1>Не удалось загрузить тренажёр</h1><p>Обновите страницу или откройте её в актуальной версии Safari, Chrome или Edge.</p></div>';
  }
});

function render(){
  const p = parseHash();
  const view = document.getElementById("view");
  if(p.length===0){ view.innerHTML = homeHTML(); window.scrollTo(0,0); }
  else { const c = bySlug[p[0]]; if(!c){go("");return;} view.innerHTML = catHTML(c); window.scrollTo(0,0); }
}

/* HOME */
function homeHTML(){
  const H = DATA.home;
  let cats = DATA.cats.map(c=>{
    const d = doneCount(c.cards);
    return `<div class="cat-card" style="--accent:${c.color}" onclick="go('${c.slug}')">
      <div class="ic">${c.icon}</div>
      <h3>${c.title}</h3>
      <p>Развивает: ${c.develops}.</p>
      <div class="meta"><span class="pill">${c.cards.length} карточек</span>
      <span class="pill ${d?'done':''}">${d?'✓ выполнено '+d:'не начато'}</span></div>
    </div>`;
  }).join("");

  const solo = H.solo.map(x=>`<li><b>${x.t}.</b> ${x.d}</li>`).join("");
  const coach = H.coach.map(x=>`<li><b>${x.t}.</b> ${x.d}</li>`).join("");
  const levels = H.levels.map(x=>`<li>${x.icon} <b>${x.t}.</b> ${x.d}</li>`).join("");
  const pr = H.principles.map(x=>`<li>${x}</li>`).join("");
  const scen = H.scenarios.map(x=>`<div class="row"><div class="q">${x.s}</div><div class="a">${x.c.join(" · ")} ${x.lvl}</div></div>`).join("");

  const totalDone = doneCount(ALL);
  return `
  <h1>Тренажёр публичных выступлений</h1>
  <p class="lead">${H.about}</p>
  <div class="panel accent">
    <p style="margin:0">${H.about2}</p>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-red" onclick="showRandom()">🎲 Открыть случайную карточку</button>
      <span class="pill" style="align-self:center;font-size:13px">Пройдено ${totalDone} из ${ALL.length}</span>
    </div>
  </div>

  <h2>Разделы тренажёра</h2>
  <p class="lead">Выберите раздел — внутри инструкция по категории, методический модуль и карточки-задания.</p>
  <div class="grid cats">${cats}</div>

  <h2>Как использовать карточки</h2>
  <div class="two">
    <div class="panel"><h3>Для самостоятельной практики</h3><ul class="ticks">${solo}</ul></div>
    <div class="panel"><h3>Для коучинга и тренингов</h3><ul class="ticks">${coach}</ul></div>
  </div>

  <h2>Уровни сложности</h2>
  <div class="panel"><ul class="ticks">${levels}</ul></div>

  <h2>Принципы эффективного использования</h2>
  <div class="panel"><ul class="ticks">${pr}</ul></div>

  <h2>Готовые сценарии под ситуацию</h2>
  <div class="scen">${scen}</div>
  `;
}

/* CATEGORY */
function catHTML(c){
  const m = c.method;
  const why = m.why.map(x=>`<li>${x}</li>`).join("");
  const ex = m.ex.map((e,i)=>`<li><b>${i+1}. ${e.t}.</b> ${e.s}${e.c?` <i style="color:var(--muted)">Проверка: ${e.c}</i>`:""}</li>`).join("");
  const d = doneCount(c.cards);
  return `
  <span class="back" style="color:var(--teal);cursor:pointer;display:inline-block;margin-bottom:14px" onclick="go('')">← Все разделы</span>
  <div class="cat-hero" style="--accent:${c.color}">
    <div class="ic">${c.icon}</div>
    <h1>${c.title}</h1>
    <p>${c.why}</p>
  </div>

  <div class="two" style="margin-top:18px">
    <div class="panel"><h3>Что развивает раздел</h3><p style="margin:4px 0 0">${c.develops.charAt(0).toUpperCase()+c.develops.slice(1)}.</p>
      <h3 style="margin-top:16px">Что внутри</h3><p style="margin:4px 0 0">${c.inside.charAt(0).toUpperCase()+c.inside.slice(1)}.</p></div>
    <div class="panel accent"><h3>Инструкция к разделу</h3>
      <p style="margin:4px 0 0">Открывайте карточки по одной или собирайте «колоду» под своё выступление.
      Нажимайте на карточку, чтобы перевернуть её и увидеть задание. Отмечайте выполненные — прогресс сохраняется в браузере.
      В разделе <b>${c.cards.length} карточек</b>, сейчас выполнено <b>${d}</b>.</p></div>
  </div>

  <h2>Методический модуль</h2>
  <div class="panel">
    <p style="margin:0 0 10px"><b>Что тренируется:</b> ${m.trains}</p>
    <p style="margin:0 0 6px"><b>Почему не получается:</b></p>
    <ul class="ticks">${why}</ul>
    <p style="margin:14px 0 0;background:#eef4f4;border-radius:10px;padding:12px 14px"><b>Ключевая идея.</b> ${m.idea}</p>
  </div>
  <div class="panel"><h3>Упражнения модуля</h3><ul class="ticks">${ex}</ul>
    <p style="margin:14px 0 0;font-size:14px;color:var(--muted)"><b>Как измерить прогресс.</b> ${m.measure}</p></div>

  <h2>Карточки раздела</h2>
  <div class="filters" id="filters">
    <button class="fbtn on" data-f="all">Все</button>
    <button class="fbtn" data-f="easy">🟢 Лёгкие</button>
    <button class="fbtn" data-f="mid">🟡 Средние</button>
    <button class="fbtn" data-f="hard">🔴 Сложные</button>
    <span class="count" id="ccount"></span>
  </div>
  <div class="cards" id="cardgrid"></div>
  `;
}

/* cards render with filter (kept separate so flips survive) */
let curFilter="all";
function renderCards(c){
  const grid=document.getElementById("cardgrid");
  if(!grid)return;
  const list=c.cards.filter(x=>curFilter==="all"||x.lvl===curFilter);
  document.getElementById("ccount").textContent=list.length+" карточек";
  if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Нет карточек этого уровня</div>';return;}
  grid.innerHTML=list.map(card=>{
    const done=DONE[card.id];
    return `<div class="flip" style="--accent:${c.color}" onclick="this.classList.toggle('flipped')">
      <div class="inner">
        ${done?'<div class="done-badge">✓</div>':''}
        <div class="face front">
          <div class="lvl">${LVL[card.lvl]}</div>
          <div class="goal">${card.goal}</div>
          <div class="tap">Нажмите, чтобы перевернуть →</div>
          <div class="n">Карточка ${card.id+1} · ${card.time}</div>
        </div>
        <div class="face back">
          <div class="task">${card.task}</div>
          <div class="foot"><span>⏱ ${card.time}</span>
            <button class="markbtn" onclick="event.stopPropagation();toggleDone(${card.id})">${done?'✓ Выполнено':'Отметить выполненной'}</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* filter wiring via delegation */
document.addEventListener("click", e=>{
  const b=e.target.closest(".fbtn"); if(!b)return;
  curFilter=b.dataset.f;
  document.querySelectorAll(".fbtn").forEach(x=>x.classList.toggle("on",x===b));
  const p=parseHash(); if(p.length) renderCards(bySlug[p[0]]);
});

/* random modal */
function showRandom(){
  const x=ALL[Math.floor(Math.random()*ALL.length)];
  document.getElementById("m-tag").textContent=x.cat+" · "+LVL[x.lvl];
  document.getElementById("m-goal").textContent=x.goal;
  document.getElementById("m-task").textContent=x.task;
  document.getElementById("m-meta").textContent="⏱ Время: "+x.time;
  const ob=document.getElementById("m-open"); ob.textContent="Открыть раздел «"+x.cat+"»"; ob.onclick=()=>{closeModal();go(x.slug);};
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){ document.getElementById("modal").classList.add("hidden"); }
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* re-render cards after home/cat render */
const _render=render;
render=function(){ _render(); const p=parseHash(); if(p.length){curFilter="all"; renderCards(bySlug[p[0]]);} };
render();
</script>
</body>
</html>
